<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator">
        <h1>Car Loan Calculator</h1>
        <p>Estimate your monthly car payment.</p>
        <form id="loan-form">
            <div class="form-group">
                <label for="car-price">Car Price</label>
                <input type="number" id="car-price" name="car-price" placeholder="25000" required />
            </div>
            <div class="form-group">
                <label for="down-payment">Down Payment</label>
                <input type="number" id="down-payment" name="down-payment" placeholder="5000" required />
            </div>
            <div class="form-group">
                <label for="loan-term">Loan Term (months)</label>
                <input type="number" id="loan-term" name="loan-term" placeholder="60" required />
            </div>
            <div class="form-group">
                <label for="interest-rate">Interest Rate (%)</label>
                <input type="number" id="interest-rate" name="interest-rate" placeholder="5" step="0.01" required />
            </div>
            <div class="button-group">
                <button type="submit">Calculate Payment</button>
                <button type="button" id="reset-button">Reset</button>
            </div>
        </form>
        <p id="error-message" role="alert" aria-live="assertive" aria-atomic="true"></p>
        <section class="results">
            <h2>Results</h2>

            <div class="result-item">
                <span class="result-label">Monthly Payment</span>
                <span id="monthly-payment">$0.00</span>
            </div>

            <div class="result-item">
                <span class="result-label">Total Payment</span>
                <span id="total-payment">$0.00</span>
            </div>

            <div class="result-item">
                <span class="result-label">Total Interest</span>
                <span id="total-interest">$0.00</span>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
